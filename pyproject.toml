[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qec"
version = "171.5.0"
description = "Deterministic multi-agent reasoning, governance, validation, and proof-artifact system for quantum error correction and invariant-driven computation."
readme = "PACKAGE_README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-repeat>=0.9",
    "networkx>=2.6"
]

science = [
    "matplotlib>=3.5",
    "pandas>=2.0",
    "qutip>=5.0",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "mido>=1.2.10"
]

# Optional external backends — not installed by default.
# Tests requiring these are skipped when unavailable.
external = [
    "stim>=1.13",
    "pymatching>=2.2",
    "qec_qldpc_codes>=0.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
qec-exp = "qec.experiments.qec_exp_cli:main"
qec-qutrit = "qec.decoder.qutrit.demo:main"
qec-ququart = "qec.decoder.ququart.demo:main"
qec-qutrit-bench = "qec.benchmark.qutrit_battery.cli:main"
qec-ququart-bench = "qec.benchmark.ququart_battery.cli:main"
qec-ququart-validate-report = "qec.benchmark.ququart_battery.validate_cli:main"
qec-nexus-bridge = "qec.adapters.nexus.cli:main"
qec-nexus-validate-replication = "qec.adapters.nexus.replication_cli:main"
qec-strowger = "qec.routing.strowger.cli:main"
qec-panel = "qec.routing.panel.cli:main"

[project.urls]
Homepage = "https://github.com/QSOLKCB/QEC"
Repository = "https://github.com/QSOLKCB/QEC"
Issues = "https://github.com/QSOLKCB/QEC/issues"
