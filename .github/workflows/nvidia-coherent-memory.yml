name: Coherent memory CPU validation
on:
  pull_request:
    paths:
      - 'src/bench/interop/nvidia_coherent_memory.py'
      - 'scripts/run_nvidia_pilot.py'
      - 'tests/test_nvidia_coherent_memory.py'
      - 'tests/test_nvidia_evidence_bundle.py'
      - 'tests/test_nvidia_gpu_acceptance.py'
      - 'tests/fixtures/nvidia_coherent_memory/**'
      - 'requirements-nvidia.txt'
      - 'requirements-memory.txt'
      - 'requirements-memory-py311.txt'
      - '.github/workflows/nvidia-coherent-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: '3.11'
            requirements: requirements-memory-py311.txt
          - python: '3.12'
            requirements: requirements-memory.txt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' -r ${{ matrix.requirements }}
      - run: python -m pytest -q tests/test_nvidia_coherent_memory.py tests/test_nvidia_evidence_bundle.py tests/test_nvidia_gpu_acceptance.py tests/test_surface_memory_correlation.py tests/test_interop_import_hygiene.py
      - run: python -m bench.interop.nvidia_coherent_memory --backend cpu --output artifacts/nvidia-pilot-cpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: coherent-memory-cpu-py${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/nvidia-pilot-cpu.json
# No GPU installed or claimed on this hosted CPU runner. GPU receipt comes later.
