name: NEXUS Bridge

on:
  pull_request:
    paths:
      - "src/qec/adapters/nexus/**"
      - "src/qec/adapters/__init__.py"
      - "src/qec/analysis/**"
      - "src/qec/runtime/**"
      - "src/qec/sims/**"
      - "src/qec/simulation/**"
      - "tests/**"
      - "docs/NEXUS_QEC_BRIDGE.md"
      - "docs/replications/**"
      - "pyproject.toml"
      - ".github/workflows/nexus-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "src/qec/adapters/nexus/**"
      - "src/qec/adapters/__init__.py"
      - "tests/test_nexus_bridge*.py"
      - "tests/test_nexus_replication.py"
      - "docs/NEXUS_QEC_BRIDGE.md"
      - "docs/replications/**"
      - "pyproject.toml"
      - ".github/workflows/nexus-bridge.yml"

permissions:
  contents: write

jobs:
  migrate-spdx:
    if: github.event_name == 'pull_request' && github.head_ref == 'legal/mpl-2.0'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout licensing branch
        uses: actions/checkout@v4
        with:
          ref: legal/mpl-2.0
          fetch-depth: 0

      - name: Replace legacy QEC MIT SPDX headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          suffixes = {
              ".c", ".cc", ".cpp", ".css", ".h", ".hpp", ".html",
              ".js", ".json", ".md", ".py", ".rs", ".sh", ".toml",
              ".ts", ".tsx", ".txt", ".yaml", ".yml",
          }
          excluded = {
              ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache",
              ".venv", "artifacts", "build", "dist", "external",
              "node_modules", "third_party", "vendor",
              "THIRD_PARTY_LICENSES",
          }
          old = "SPDX-License-Identifier: MIT"
          new = "SPDX-License-Identifier: MPL-2.0"
          paths = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")
          changed = []
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw)
              if path.suffix.lower() not in suffixes:
                  continue
              if any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              lines = text.splitlines(keepends=True)
              replaced = False
              for index, line in enumerate(lines[:20]):
                  if old in line:
                      lines[index] = line.replace(old, new)
                      replaced = True
              if replaced:
                  path.write_text("".join(lines), encoding="utf-8")
                  changed.append(raw)
          print(f"converted {len(changed)} QEC-owned SPDX headers")
          for path in changed:
              print(path)
          PY

      - name: Commit atomic header migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No legacy SPDX headers remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Convert all QEC SPDX headers to MPL-2.0 [skip ci]"
          git push origin HEAD:legal/mpl-2.0

  validate:
    needs: migrate-spdx
    if: always() && (needs.migrate-spdx.result == 'success' || needs.migrate-spdx.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QEC with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEC
        run: python -m pip install -e ".[dev]"

      - name: Run complete QEC validation suite
        run: python -m pytest -q

      - name: Validate committed NEXUS v4.0.1 qBraid receipt
        run: >-
          qec-nexus-validate-replication receipt
          --receipt docs/replications/nexus_v4_0_1_qbraid_receipt.json

      - name: Checkout published NEXUS v3 baseline
        uses: actions/checkout@v4
        with:
          repository: QSOLKCB/NEXUS
          ref: e078b135322dc12a2565b9c512fc4ba75193dea7
          path: external/NEXUS-v3
          fetch-depth: 1

      - name: Build NEXUS v3 baseline
        working-directory: external/NEXUS-v3
        run: cargo build --release --locked

      - name: Attest NEXUS v3 build
        run: >-
          qec-nexus-bridge attest-build
          --profile v3.0.0
          --binary external/NEXUS-v3/target/release/nexus
          --toolchain "$(rustc --version) / $(cargo --version)"
          --output artifacts/v3-build-attestation.json

      - name: Verify NEXUS v3 through QEC
        run: >-
          qec-nexus-bridge verify
          --profile v3.0.0
          --binary external/NEXUS-v3/target/release/nexus
          --attestation artifacts/v3-build-attestation.json
          --output artifacts/v3-verify

      - name: Trace NEXUS v3 through QEC
        run: >-
          qec-nexus-bridge trace
          --profile v3.0.0
          --binary external/NEXUS-v3/target/release/nexus
          --attestation artifacts/v3-build-attestation.json
          --channel 17
          --steps 32
          --output artifacts/v3-trace

      - name: Checkout frozen NEXUS v4 source profile
        uses: actions/checkout@v4
        with:
          repository: QSOLKCB/NEXUS
          ref: 1e93a509a28144d70a17fa76b330ae042db7beab
          path: external/NEXUS-v4
          fetch-depth: 1

      - name: Build NEXUS v4 source profile
        working-directory: external/NEXUS-v4
        run: cargo build --release --locked

      - name: Attest NEXUS v4 build
        run: >-
          qec-nexus-bridge attest-build
          --profile v4.0.0
          --binary external/NEXUS-v4/target/release/nexus
          --toolchain "$(rustc --version) / $(cargo --version)"
          --output artifacts/v4-build-attestation.json

      - name: Verify scalar NEXUS v4
        run: >-
          qec-nexus-bridge verify
          --profile v4.0.0
          --binary external/NEXUS-v4/target/release/nexus
          --attestation artifacts/v4-build-attestation.json
          --output artifacts/v4-verify

      - name: Verify parallel NEXUS v4
        run: >-
          qec-nexus-bridge verify-parallel
          --profile v4.0.0
          --binary external/NEXUS-v4/target/release/nexus
          --attestation artifacts/v4-build-attestation.json
          --workers 2
          --output artifacts/v4-verify-parallel

      - name: Verify Fibonacci representative ordering
        run: >-
          qec-nexus-bridge fibonacci
          --profile v4.0.0
          --binary external/NEXUS-v4/target/release/nexus
          --attestation artifacts/v4-build-attestation.json
          --channel 17
          --steps 32
          --output artifacts/v4-fibonacci

      - name: Verify ternary sonification events
        run: >-
          qec-nexus-bridge ternary
          --profile v4.0.0
          --binary external/NEXUS-v4/target/release/nexus
          --attestation artifacts/v4-build-attestation.json
          --channel 17
          --steps 32
          --base-frequency-hz 432
          --output artifacts/v4-ternary

      - name: Verify native triality receipts
        run: >-
          qec-nexus-bridge receipt
          --profile v4.0.0
          --binary external/NEXUS-v4/target/release/nexus
          --attestation artifacts/v4-build-attestation.json
          --samples 99
          --output artifacts/v4-receipts

      - name: Revalidate generated QEC parent receipts
        run: |
          find artifacts -name execution_receipt.json -print0 |
            while IFS= read -r -d '' receipt; do
              qec-nexus-bridge validate --receipt "$receipt"
            done

      - name: Copy canonical replication receipt into evidence bundle
        run: >-
          cp docs/replications/nexus_v4_0_1_qbraid_receipt.json
          artifacts/nexus_v4_0_1_qbraid_receipt.json

      - name: Upload NEXUS bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: qec-v170.2.1-nexus-bridge-evidence
          path: artifacts/
