# SPDX-License-Identifier: MPL-2.0
name: Panel Exchange Validation

on:
  pull_request:
    paths: ["src/qec/routing/panel/**", "tests/panel/**", "viz/panel/**", "pyproject.toml", "PACKAGE_README.md"]
  push:
    branches: [main]
    paths: ["src/qec/routing/panel/**", "tests/panel/**", "viz/panel/**", "pyproject.toml", "PACKAGE_README.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m pytest -q tests/panel
      - run: node --check viz/panel/app.js
      - run: qec-panel route --digits 2,3,4,11 --request-id ci-panel --destination ququart/site-4/pauli-11 --output-dir artifacts/panel
      - run: qec-panel validate --receipt artifacts/panel/panel_route_receipt.json
