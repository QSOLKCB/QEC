# SPDX-License-Identifier: MPL-2.0
name: Build and Test Pipeline
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    name: Full repository regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QEC and development requirements
        run: python -m pip install -e '.[dev]'
      - name: Run complete QEC suite without swallowing failures
        run: python -m pytest -q
  docker-build:
    name: Container regression gate
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build with runner-provided Docker
        run: docker build -t qsolkcb-qec:ci -f Dockerfile .
      - name: Run complete container suite without swallowing failures
        run: |
          mkdir -p artifacts "$RUNNER_TEMP/qec-home" "$RUNNER_TEMP/qec-artifacts"
          cp -a artifacts/. "$RUNNER_TEMP/qec-artifacts/"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/qec-home \
            --mount "type=bind,src=$PWD,dst=/app,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/qec-home,dst=/tmp/qec-home" \
            --mount "type=bind,src=$RUNNER_TEMP/qec-artifacts,dst=/app/artifacts" \
            qsolkcb-qec:ci python -m pytest -q
