name: NEXUS Bridge

on:
  pull_request:
    paths:
      - "src/qec/adapters/nexus/**"
      - "src/qec/adapters/__init__.py"
      - "tests/test_nexus_bridge*.py"
      - "tests/test_nexus_replication.py"
      - "docs/NEXUS_QEC_BRIDGE.md"
      - "docs/replications/**"
      - "pyproject.toml"
      - ".github/workflows/nexus-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "src/qec/adapters/nexus/**"
      - "src/qec/adapters/__init__.py"
      - "tests/test_nexus_bridge*.py"
      - "tests/test_nexus_replication.py"
      - "docs/NEXUS_QEC_BRIDGE.md"
      - "docs/replications/**"
      - "pyproject.toml"
      - ".github/workflows/nexus-bridge.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QEC with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QEC
        run: python -m pip install -e ".[dev]"

      - name: Run complete QEC validation suite
        run: python -m pytest -q

      - name: Validate committed NEXUS v4.0.1 qBraid receipt
        run: >-
          qec-nexus-validate-replication receipt
          --receipt docs/replications/nexus_v4_0_1_qbraid_receipt.json

      - name: Validate and record frozen NEXUS source identities
        run: |
          python - <<'PY'
          from pathlib import Path

          from qec.adapters.nexus import NEXUS_V3, NEXUS_V4
          from qec.sonify.canonical import canonical_json, canonical_sha256

          expected = {
              "v3.0.0": {
                  "commit": "e078b135322dc12a2565b9c512fc4ba75193dea7",
                  "doi": "10.5281/zenodo.21745329",
              },
              "v4.0.0": {
                  "commit": "1e93a509a28144d70a17fa76b330ae042db7beab",
                  "doi": "10.5281/zenodo.21748514",
              },
          }
          sources = (NEXUS_V3, NEXUS_V4)
          for source in sources:
              identity = expected[source.profile]
              if source.repository != "https://github.com/QSOLKCB/NEXUS":
                  raise SystemExit(f"unexpected historical repository identity for {source.profile}")
              if source.commit != identity["commit"]:
                  raise SystemExit(f"unexpected historical commit identity for {source.profile}")
              if source.doi != identity["doi"] or source.doi_status != "published":
                  raise SystemExit(f"unexpected DOI identity for {source.profile}")

          status = {
              "schema": "qec.nexus-historical-source-status.v1",
              "ci_source_mode": "archival_evidence_validation",
              "historical_repository_rebuild_in_required_ci": False,
              "source_substitution_allowed": False,
              "source_profiles": [source.as_dict() for source in sources],
              "replication_receipt": "docs/replications/nexus_v4_0_1_qbraid_receipt.json",
              "replication_archive_sha256": "659e493a1b80b391db99b79dd6ee4e7a9b23c1821ff11eadbc3c5c36b10660d8",
          }
          status["sha256"] = canonical_sha256(status)
          output = Path("artifacts/nexus_historical_source_status.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(canonical_json(status) + "\n", encoding="utf-8")
          print(canonical_json(status))
          PY

      - name: Copy canonical replication receipt into evidence bundle
        run: >-
          cp docs/replications/nexus_v4_0_1_qbraid_receipt.json
          artifacts/nexus_v4_0_1_qbraid_receipt.json

      - name: Upload NEXUS bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: qec-v170.2.1-nexus-bridge-evidence
          path: artifacts/
