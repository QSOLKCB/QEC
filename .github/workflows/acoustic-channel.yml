# SPDX-License-Identifier: MPL-2.0
name: Acoustic Classical Channel Evidence
on:
  pull_request:
    paths:
      - 'src/qec/experiments/acoustic/**'
      - 'tests/acoustic/**'
      - 'docs/ACOUSTIC_*.md'
      - 'docs/labs/acoustic-*'
      - 'scripts/generate_acoustic*_evidence.py'
      - '.github/workflows/acoustic-channel.yml'
  push:
    branches: [main]
    paths:
      - 'src/qec/experiments/acoustic/**'
      - 'tests/acoustic/**'
      - 'docs/ACOUSTIC_*.md'
      - 'docs/labs/acoustic-*'
      - 'scripts/generate_acoustic*_evidence.py'
      - '.github/workflows/acoustic-channel.yml'
permissions:
  contents: read
jobs:
  acoustic:
    name: Acoustic ${{ matrix.os }} Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-14
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test exact PCM and acoustic contracts
        run: python -m pytest -q tests/acoustic
      - name: Export source-bound known-answer evidence
        run: python scripts/generate_acoustic_channel_evidence.py --output artifacts/acoustic-channel
      - name: Export independently replayed trial and native transport evidence
        run: python scripts/generate_acoustic_trial_evidence.py --output artifacts/acoustic-channel/trial-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: acoustic-${{ matrix.os }}-py${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/acoustic-channel
          if-no-files-found: error
  full-regression:
    name: Acoustic exact-head full regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
