name: Ququart FER Pages

on:
  pull_request:
    paths:
      - "src/qec/decoder/ququart/**"
      - "src/qec/benchmark/ququart_battery/**"
      - "src/qec/sonify/ququart_harmonics.py"
      - "tests/test_ququart_*.py"
      - "docs/QUQUART_FER_BATTERY.md"
      - "docs/replications/**"
      - "viz/**"
      - "pyproject.toml"
      - ".github/workflows/ququart-fer-pages.yml"
  push:
    branches: [main]
    paths:
      - "src/qec/decoder/ququart/**"
      - "src/qec/benchmark/ququart_battery/**"
      - "src/qec/sonify/ququart_harmonics.py"
      - "tests/test_ququart_*.py"
      - "docs/QUQUART_FER_BATTERY.md"
      - "docs/replications/**"
      - "viz/**"
      - "pyproject.toml"
      - ".github/workflows/ququart-fer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ququart-fer-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install QEC
        run: python -m pip install -e ".[dev]"

      - name: Run full repository test suite
        run: python -m pytest -q

      - name: Generate v170.1.1 evidence
        run: >-
          qec-ququart-bench
          --output viz/ququart-fer/results
          --trials 10000
          --harmonic-trials 4000
          --seed 1701001

      - name: Validate generated report claims
        run: >-
          qec-ququart-validate-report
          --claims viz/ququart-fer/results/report_claims.json
          --evidence viz/ququart-fer/results

      - name: Disable Jekyll processing
        run: touch viz/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: viz

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
