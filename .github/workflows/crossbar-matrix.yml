# SPDX-License-Identifier: MPL-2.0
name: Crossbar Matrix and Common-Control Validation

on:
  pull_request:
    paths:
      - "src/qec/routing/crossbar/**"
      - "tests/crossbar/**"
      - "docs/CROSSBAR_COORDINATE_MATRIX.md"
      - "docs/CROSSBAR_COMMON_CONTROL.md"
      - "pyproject.toml"
      - "PACKAGE_README.md"
      - "README.md"
      - "tests/test_readme_boundary_enforcement.py"
      - ".github/workflows/crossbar-matrix.yml"
  push:
    branches: [main]
    paths:
      - "src/qec/routing/crossbar/**"
      - "tests/crossbar/**"
      - "docs/CROSSBAR_COORDINATE_MATRIX.md"
      - "docs/CROSSBAR_COMMON_CONTROL.md"
      - "pyproject.toml"
      - "PACKAGE_README.md"
      - "README.md"
      - "tests/test_readme_boundary_enforcement.py"
      - ".github/workflows/crossbar-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QEC
        run: python -m pip install -e .[dev]
      - name: Crossbar focused suite
        run: python -m pytest -q tests/crossbar
      - name: Full QEC regression gate
        run: python -m pytest -q
      - name: Crossbar CLI round-trip
        run: |
          rm -rf artifacts/crossbar-ci
          qec-crossbar matrix \
            --matrix-id ci-crossbar \
            --horizontal-count 4 \
            --vertical-count 3 \
            --link-state H001=busy \
            --output-dir artifacts/crossbar-ci
          qec-crossbar validate \
            --manifest artifacts/crossbar-ci/crossbar_matrix_manifest.json
      - name: Marker CLI round-trip
        run: |
          python -c 'from pathlib import Path; Path("artifacts/crossbar-ci/payload.bin").write_bytes(b"opaque-correction")'
          qec-crossbar marker \
            --manifest artifacts/crossbar-ci/crossbar_matrix_manifest.json \
            --request-id ci-marker \
            --horizontal-link-id H000 --vertical-link-id V001 \
            --payload-file artifacts/crossbar-ci/payload.bin \
            --decoder-output-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --output-dir artifacts/crossbar-ci/marker
          qec-crossbar marker-validate \
            --receipt artifacts/crossbar-ci/marker/crossbar_common_control_receipt.json
