# SPDX-License-Identifier: MPL-2.0
name: Strowger Syndrome Exchange

on:
  pull_request:
    paths:
      - "src/qec/routing/**"
      - "tests/strowger/**"
      - "viz/strowger/**"
      - "docs/STROWGER_SYNDROME_EXCHANGE.md"
      - "pyproject.toml"
      - ".github/workflows/strowger-exchange.yml"
  push:
    branches: [main]
    paths:
      - "src/qec/routing/**"
      - "tests/strowger/**"
      - "viz/strowger/**"
      - "docs/STROWGER_SYNDROME_EXCHANGE.md"
      - "pyproject.toml"
      - ".github/workflows/strowger-exchange.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install QEC
        run: python -m pip install -e ".[dev]"

      - name: Run full repository test suite
        run: python -m pytest -q

      - name: Check offline lab JavaScript
        run: node --check viz/strowger/app.js

      - name: Generate deterministic route receipt
        run: >-
          qec-strowger route
          --digits 2,3,4,11
          --radices 3,4,10,16
          --request-id ci-syndrome
          --destination ququart/site-4/pauli-11
          --output artifacts/strowger-route.json

      - name: Revalidate route receipt
        run: >-
          qec-strowger validate
          --receipt artifacts/strowger-route.json

      - name: Upload route evidence
        uses: actions/upload-artifact@v4
        with:
          name: qec-v170.3.0-strowger-route
          path: artifacts/strowger-route.json
