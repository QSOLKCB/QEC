name: Surface memory correlation physics
on:
  pull_request:
    paths:
      - 'src/bench/interop/**'
      - 'tests/test_surface_memory_correlation.py'
      - 'requirements-memory.txt'
      - '.github/workflows/surface-memory-correlation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' -r requirements-memory.txt
      - run: python -m pytest -q tests/test_surface_memory_correlation.py tests/test_interop_determinism.py tests/test_interop_import_hygiene.py tests/test_interop_schema_v312.py
      - run: python -m bench.interop.memory_correlation --shots 2000 --seed 12345 --output artifacts/surface_memory_correlation/ci.json
      - name: Validate bounded 150-round lane
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          from bench.interop.runners import run_surface_memory_correlation
          result = run_surface_memory_correlation(distances=(5,), rounds=(150,), shots=128)
          assert result["status"] == "completed"
          Path("artifacts/surface_memory_correlation/ci-longround150.json").write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n"
          )
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: surface-memory-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/surface_memory_correlation/ci*.json
