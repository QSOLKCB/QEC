# SPDX-License-Identifier: MPL-2.0
name: ESS Stored-Program Skeleton Validation

on:
  pull_request:
    paths:
      - "src/qec/routing/ess/**"
      - "src/qec/routing/crossbar/**"
      - "src/qec/sonify/canonical.py"
      - "tests/ess/**"
      - "docs/ESS_STORED_PROGRAM_SKELETON.md"
      - "pyproject.toml"
      - ".github/workflows/ess-skeleton.yml"
  push:
    branches: [main]
    paths:
      - "src/qec/routing/ess/**"
      - "src/qec/routing/crossbar/**"
      - "src/qec/sonify/canonical.py"
      - "tests/ess/**"
      - "docs/ESS_STORED_PROGRAM_SKELETON.md"
      - "pyproject.toml"
      - ".github/workflows/ess-skeleton.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full regression gate compares decoder files against HEAD^.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QEC
        run: python -m pip install -e .[dev]
      - name: ESS and Crossbar boundary tests
        run: python -m pytest -q tests/ess tests/crossbar
      - name: Full QEC regression gate
        run: python -m pytest -q
      - name: ESS CLI round-trip
        run: |
          qec-ess demo --output-dir artifacts/ess-ci
          qec-ess run --input artifacts/ess-ci/ess_switch_input.json --output-dir artifacts/ess-ci
          qec-ess validate --receipt artifacts/ess-ci/ess_switch_skeleton_receipt.json
