# SPDX-License-Identifier: MPL-2.0
name: Crossbar Matrix, Common-Control, Multi-Stage, Contention and Continuity Validation

on:
  pull_request:
    paths:
      - "src/qec/routing/crossbar/**"
      - "tests/crossbar/**"
      - "docs/CROSSBAR_COORDINATE_MATRIX.md"
      - "docs/CROSSBAR_COMMON_CONTROL.md"
      - "docs/CROSSBAR_MULTISTAGE_SELECTION.md"
      - "docs/CROSSBAR_CONTENTION.md"
      - "docs/CROSSBAR_CONTINUITY.md"
      - "pyproject.toml"
      - "PACKAGE_README.md"
      - "README.md"
      - "tests/test_readme_boundary_enforcement.py"
      - ".github/workflows/crossbar-matrix.yml"
  push:
    branches: [main]
    paths:
      - "src/qec/routing/crossbar/**"
      - "tests/crossbar/**"
      - "docs/CROSSBAR_COORDINATE_MATRIX.md"
      - "docs/CROSSBAR_COMMON_CONTROL.md"
      - "docs/CROSSBAR_MULTISTAGE_SELECTION.md"
      - "docs/CROSSBAR_CONTENTION.md"
      - "docs/CROSSBAR_CONTINUITY.md"
      - "pyproject.toml"
      - "PACKAGE_README.md"
      - "README.md"
      - "tests/test_readme_boundary_enforcement.py"
      - ".github/workflows/crossbar-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QEC
        run: python -m pip install -e .[dev]
      - name: Crossbar focused suite
        run: python -m pytest -q tests/crossbar
      - name: Full QEC regression gate
        run: python -m pytest -q
      - name: Crossbar CLI round-trip
        run: |
          rm -rf artifacts/crossbar-ci
          qec-crossbar matrix \
            --matrix-id ci-crossbar \
            --horizontal-count 4 \
            --vertical-count 3 \
            --link-state H001=busy \
            --output-dir artifacts/crossbar-ci
          qec-crossbar validate \
            --manifest artifacts/crossbar-ci/crossbar_matrix_manifest.json
      - name: Marker CLI round-trip
        run: |
          python -c 'from pathlib import Path; Path("artifacts/crossbar-ci/payload.bin").write_bytes(b"opaque-correction")'
          qec-crossbar marker \
            --manifest artifacts/crossbar-ci/crossbar_matrix_manifest.json \
            --request-id ci-marker \
            --horizontal-link-id H000 --vertical-link-id V001 \
            --payload-file artifacts/crossbar-ci/payload.bin \
            --decoder-output-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --output-dir artifacts/crossbar-ci/marker
          qec-crossbar marker-validate \
            --receipt artifacts/crossbar-ci/marker/crossbar_common_control_receipt.json
      - name: Multi-stage CLI round-trip
        run: |
          qec-crossbar fabric-demo --output-dir artifacts/crossbar-ci/fabric
          qec-crossbar path-search \
            --fabric artifacts/crossbar-ci/fabric/crossbar_fabric_manifest.json \
            --source-matrix-id ingress --destination-matrix-id egress \
            --request-id ci-path --horizontal-link-id H000 --vertical-link-id V001 \
            --payload-file artifacts/crossbar-ci/payload.bin \
            --decoder-output-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --output-dir artifacts/crossbar-ci/path
          qec-crossbar path-validate \
            --receipt artifacts/crossbar-ci/path/crossbar_path_search_receipt.json
      - name: Contention CLI round-trip
        run: |
          qec-crossbar contention-demo --output-dir artifacts/crossbar-ci/contention
          qec-crossbar contend \
            --input artifacts/crossbar-ci/contention/crossbar_contention_input.json \
            --output-dir artifacts/crossbar-ci/contention
          qec-crossbar contention-validate \
            --receipt artifacts/crossbar-ci/contention/crossbar_contention_receipt.json
      - name: Continuity CLI round-trips
        run: |
          qec-crossbar continuity \
            --receipt artifacts/crossbar-ci/path/crossbar_path_search_receipt.json \
            --output-dir artifacts/crossbar-ci/path-continuity
          qec-crossbar continuity-validate \
            --receipt artifacts/crossbar-ci/path-continuity/crossbar_continuity_receipt.json
          qec-crossbar continuity \
            --receipt artifacts/crossbar-ci/contention/crossbar_contention_receipt.json \
            --output-dir artifacts/crossbar-ci/contention-continuity
          qec-crossbar continuity-validate \
            --receipt artifacts/crossbar-ci/contention-continuity/crossbar_continuity_receipt.json
